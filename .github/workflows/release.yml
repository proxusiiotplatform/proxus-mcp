# Publishes proxus-mcp binaries to a GitHub release for a tag such as v0.1.0 or v0.1.0-beta.1 on a commit of main.
# Each platform builds, tests and uploads its own archive and checksum straight to the release, so nothing goes
# through the account's artifact storage. A tag with a pre-release suffix becomes a pre-release.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  create:
    # Only a tag the repository owner pushed releases.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version from the tag, on main only
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-pre-release]."
            exit 1
          fi
          # fetch-depth: 0 already brought origin/main; fetching again would need the credentials this job drops.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "proxus-mcp $TAG" --generate-notes $prerelease

  build:
    needs: create
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, exe: proxus-mcp }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: proxus-mcp }
          - { os: windows-2025, rid: win-x64, exe: proxus-mcp.exe }
          - { os: macos-15, rid: osx-arm64, exe: proxus-mcp }
          - { os: macos-15, rid: osx-x64, exe: proxus-mcp }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test tests/Proxus.Mcp.Tests -c Release

      - name: Publish (Native AOT)
        env:
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          dotnet publish src/Proxus.Mcp.Server -c Release -r ${{ matrix.rid }} -o publish -warnaserror \
            -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Reports its version
        # osx-x64 is cross-compiled on an arm64 runner; Rosetta runs it.
        run: |
          out=$(./publish/${{ matrix.exe }} --version)
          echo "$out"
          [[ "$out" == "proxus-mcp ${{ needs.create.outputs.version }}" ]]

      - name: Archive and checksum
        id: archive
        env:
          NAME: proxus-mcp-${{ needs.create.outputs.version }}-${{ matrix.rid }}
        run: |
          mkdir -p "dist/$NAME"
          cp "publish/${{ matrix.exe }}" README.md LICENSE proxus-mcp.example.json "dist/$NAME/"
          cd dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a -tzip -bd "$NAME.zip" "$NAME" > /dev/null
            file="$NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            file="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          echo "file=dist/$file" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.archive.outputs.file }}" "${{ steps.archive.outputs.file }}.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  docker:
    # Multi-architecture image from the two Linux binaries the build jobs uploaded to the release.
    needs: [create, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Binaries from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          for pair in amd64:linux-x64 arm64:linux-arm64; do
            arch=${pair%%:*}; rid=${pair#*:}
            gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" -p "proxus-mcp-$VERSION-$rid.tar.gz" -D dl
            (cd dl && sha256sum --check <(gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" -p "proxus-mcp-$VERSION-$rid.tar.gz.sha256" -O -))
            mkdir -p "dist/$arch" && tar -xzf "dl/proxus-mcp-$VERSION-$rid.tar.gz" -C dl
            cp "dl/proxus-mcp-$VERSION-$rid/proxus-mcp" "dist/$arch/proxus-mcp"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags="-t $image:$VERSION"
          [[ "$VERSION" != *-* ]] && tags="$tags -t $image:latest"
          docker buildx build --platform linux/amd64,linux/arm64 --push $tags \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.licenses=Apache-2.0 .
