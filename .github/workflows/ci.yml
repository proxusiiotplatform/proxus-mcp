name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, exe: proxus-mcp }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: proxus-mcp }
          - { os: windows-2025, rid: win-x64, exe: proxus-mcp.exe }
          - { os: macos-15, rid: osx-arm64, exe: proxus-mcp }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test tests/Proxus.Mcp.Tests -c Release

      - name: Publish (Native AOT)
        run: dotnet publish src/Proxus.Mcp.Server -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }} -warnaserror

      - name: Answers an MCP initialize over stdio
        run: |
          echo '{"devices":{"m":{"protocol":"modbus-tcp","host":"127.0.0.1"}}}' > ci.json
          { echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 5; } \
            | ./artifacts/${{ matrix.rid }}/${{ matrix.exe }} --config ci.json > reply.txt || true
          grep -q '"name":"proxus-mcp"' reply.txt

      # Binaries are uploaded only on a manual run: the account's shared artifact storage is small, and the smoke job
      # builds its own copy.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: proxus-mcp-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/${{ matrix.exe }}
            README.md
            proxus-mcp.example.json
          retention-days: 3

  smoke:
    name: smoke (simulators)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish (Native AOT)
        run: dotnet publish src/Proxus.Mcp.Server -c Release -r linux-x64 -o artifacts/linux-x64
      - name: Simulators
        run: python -m pip install --quiet pymodbus==3.12.0 asyncua==1.1.8
      - name: Smoke tests
        run: tests/smoke/run_all.sh artifacts/linux-x64/proxus-mcp "$(command -v python)"
